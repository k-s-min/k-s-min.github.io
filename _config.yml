
# Site configuration

# 1. Files excluded from Jekyll builds
exclude:
- README.md
- CODE_OF_CONDUCT.md
- CONTRIBUTING.md
- screenshot.png
- LICENSE
- CNAME
- Gemfile
- Gemfile.lock
- garth-jekyll-theme.gemspec

# 2. Installed Gems
plugins:
- jekyll-paginate

# 3. Gem settings
paginate: 5
paginate_path: page:num

# 4. Jekyll settings
sass:
  style: compressed
permalink: pretty
excerpt_separator: <!-- more -->
timezone: Asia/Seoul

# 5. Collections
collections:
  posts:
    title: Projects
    output: true
    description: "금융 데이터 분석 및 퀀트 투자 전략 연구"

# 6. Jekyll collections settings
defaults:
  -
    scope:
      path: ""
      type: pages
    values:
      layout: page
  -
    scope:
      path: ""
      type: posts
    values:
      layout: post

# 7. Site settings
encoding: utf-8
title: "k-s-min Portfolio"
# logo: "/assets/logo.svg"
# favicon: "/favicon.ico"
description: "Quantitative Finance & Data Analysis"
url: "https://k-s-min.github.io"
baseurl: ""
lang: ko-KR
